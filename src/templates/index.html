<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <header>
        <h1>Expense Tracker</h1>
        <nav>
            <a href="{{ url_for('home') }}">Home</a>
            <a href="{{ url_for('add_page') }}">Add Purchase</a>
            <a href="{{ url_for('categories_page') }}">Manage Categories</a>
            <a href="{{ url_for('budgets_page') }}">Manage Budgets</a>
            <a href="{{ url_for('monthly_page') }}">Monthly Overview</a>
            <a href="{{ url_for('recent_page') }}">View Recent</a>
            <a href="{{ url_for('logout') }}">Logout</a>
        </nav>
    </header>
    <main>
        <h2>Welcome to Your Expense Tracker</h2>
        <p>Track your spending and stay on top of your finances.</p>
        
        <div class="action-buttons">
            <a href="{{ url_for('add_page') }}" class="btn-primary">Add New Expense</a>
            <a href="/api/export-csv" class="btn-secondary" download>Export to CSV</a>
            <button onclick="document.getElementById('csvImportInput').click()" class="btn-secondary">Import from CSV</button>
            <input type="file" id="csvImportInput" accept=".csv" style="display: none;" onchange="handleCSVImport(event)">
        </div>

        <div id="importMessage" style="display: none; margin: 20px 0;"></div>

        <h2>All Time Data</h2>
        <div id="dataContainer">
            <div id="pieChartContainer">
                <canvas id="allTimeCategoriesChart"></canvas>
            </div>
            <div id="lineGraphContainer">
                <canvas id="monthlySpendingChart"></canvas>
            </div>
        </div>
    </main>
    <script src="{{ url_for('static', filename='script.js') }}"></script>
    <script src="{{ url_for('static', filename='import-export.js') }}"></script>
</body>
</html>
