<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Purchase - Expense Tracker</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
    <header>
        <h1>Expense Tracker</h1>
        <nav>
            <a href="{{ url_for('home') }}">Home</a>
            <a href="{{ url_for('add_page') }}">Add Purchase</a>
            <a href="{{ url_for('categories_page') }}">Manage Categories</a>
            <a href="{{ url_for('budgets_page') }}">Manage Budgets</a>
            <a href="{{ url_for('monthly_page') }}">Monthly Overview</a>
            <a href="{{ url_for('recent_page') }}">View Recent</a>
            <a href="{{ url_for('logout') }}">Logout</a>
        </nav>
    </header>
    <main>
        <h2>Add a Purchase</h2>
        <form id="purchaseForm" enctype="multipart/form-data">
            <label for="date">Date: <span class="required">*</span></label>
            <input type="date" id="date" name="date" required>

            <label for="business">Business: <span class="required">*</span></label>
            <input type="text" id="business" name="business" required placeholder="e.g., Walmart, Amazon">

            <label for="amount">Amount: <span class="required">*</span></label>
            <input type="number" id="amount" name="amount" step="0.01" min="0" required placeholder="0.00">

            <label for="category">Category: <span class="required">*</span></label>
            <input type="text" id="category" name="category" required placeholder="Start typing..." autocomplete="off" list="categoryList">
            <datalist id="categoryList"></datalist>

            <label for="description">Description:</label>
            <textarea id="description" name="description" rows="2" placeholder="Optional brief description"></textarea>

            <label for="tags">Tags:</label>
            <input type="text" id="tags" name="tags" placeholder="e.g., work, personal, travel (comma-separated)">

            <label for="notes">Notes:</label>
            <textarea id="notes" name="notes" rows="2" placeholder="Optional additional notes"></textarea>

            <label for="is_recurring">
                <input type="checkbox" id="is_recurring" name="is_recurring">
                Recurring Expense
            </label>

            <label for="photo">Receipt:</label>
            <input type="file" id="photo" name="photo" accept="image/*">

            <button type="submit">Add Purchase</button>
        </form>
        <p id="statusMessage"></p>
        <div id="budgetAlert" class="budget-alert" style="display: none;"></div>
    </main>
    <script src="{{ url_for('static', filename='script.js') }}"></script>
    <script src="{{ url_for('static', filename='add-expense.js') }}"></script>
</body>
</html>
