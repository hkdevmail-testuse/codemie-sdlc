<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Budgets - Expense Tracker</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
    <header>
        <h1>Expense Tracker</h1>
        <nav>
            <a href="{{ url_for('home') }}">Home</a>
            <a href="{{ url_for('add_page') }}">Add Purchase</a>
            <a href="{{ url_for('categories_page') }}">Manage Categories</a>
            <a href="{{ url_for('budgets_page') }}">Manage Budgets</a>
            <a href="{{ url_for('monthly_page') }}">Monthly Overview</a>
            <a href="{{ url_for('recent_page') }}">View Recent</a>
            <a href="{{ url_for('logout') }}">Logout</a>
        </nav>
    </header>
    <main>
        <h2>Manage Budgets</h2>
        
        <div class="budget-status-section">
            <h3>Current Month Budget Status</h3>
            <div id="budgetStatusContainer">
                <!-- Populated dynamically -->
            </div>
        </div>

        <div class="form-section">
            <h3>Add New Budget</h3>
            <form id="budgetForm">
                <label for="budgetCategory">Category: <span class="required">*</span></label>
                <select id="budgetCategory" name="budgetCategory" required>
                    <option value="">Select a category</option>
                </select>

                <label for="budgetAmount">Budget Amount: <span class="required">*</span></label>
                <input type="number" id="budgetAmount" name="budgetAmount" step="0.01" min="0" required placeholder="0.00">

                <label for="periodType">Period:</label>
                <select id="periodType" name="periodType">
                    <option value="monthly" selected>Monthly</option>
                </select>

                <button type="submit">Add Budget</button>
            </form>
            <p id="budgetMessage"></p>
        </div>

        <div class="table-section">
            <h3>Existing Budgets</h3>
            <table id="budgetsTable">
                <thead>
                    <tr>
                        <th>Category</th>
                        <th>Budget Amount</th>
                        <th>Period</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Populated dynamically -->
                </tbody>
            </table>
        </div>
    </main>
    <script src="{{ url_for('static', filename='budgets.js') }}"></script>
</body>
</html>
